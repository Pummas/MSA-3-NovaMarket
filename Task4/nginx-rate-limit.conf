events {
    worker_connections 1024;
}

http {
    # Ключ для лимита: только если заголовок совпал — иначе пусто (запрос не считается)
    map $http_x_client_type $web_client_key {
        "web"    $binary_remote_addr;
        default  "";
    }

    map $http_x_client_type $mobile_client_key {
        "mobile" $binary_remote_addr;
        default  "";
    }

    # Отдельный ключ для всех, кто не web и не mobile (партнёрские API, боты)
    map $http_x_client_type $default_client_key {
        "web"    "";
        "mobile" "";
        default  $binary_remote_addr;
    }

    limit_req_zone $web_client_key     zone=web_zone:10m     rate=50r/s;
    limit_req_zone $mobile_client_key  zone=mobile_zone:10m  rate=30r/s;
    limit_req_zone $default_client_key zone=default_zone:10m rate=10r/s;

    upstream backend {
        server localhost:8081;
    }

    server {
        listen 80;

        location /api/ {
            limit_req zone=web_zone     burst=20 nodelay;
            limit_req zone=mobile_zone  burst=20 nodelay;
            limit_req zone=default_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
        }
    }
}